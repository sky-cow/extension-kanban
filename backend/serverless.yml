service: taskboard

custom:
  tablePrefix: ${env:DYNAMODB_TABLE_PREFIX, 'taskboard-dev'}
  serviceName: ${env:SERVICE_NAME, 'taskboard'}
  stage: ${opt:stage, 'dev'}

  # local/dev plugin settings (moved here to avoid duplicate 'custom' mappings)
  serverless-offline:
    httpPort: 3000
    websocketPort: 3001

  dynamodb:
    stages:
      - dev
    start:
      port: 8000
      inMemory: true
      migrate: true
      seed: false

provider:
  name: aws
  runtime: nodejs18.x
  region: ${opt:region, 'us-east-1'}
  stage: ${self:custom.stage}
  environment:
    DYNAMODB_TABLE_PREFIX: ${self:custom.tablePrefix}
    GOOGLE_CLIENT_ID: ${env:GOOGLE_CLIENT_ID, ''}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID, ''}
    COGNITO_CLIENT_ID: ${env:COGNITO_CLIENT_ID, ''}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:BatchWriteItem
            - dynamodb:TransactWriteItems
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.tablePrefix}-*
            - arn:aws:logs:${self:provider.region}:*:log-group:/aws/lambda/${self:service}-${self:provider.stage}-*

functions:
  # REST API
  api:
    handler: src/lambda.handler
    events:
      - http:
          path: /
          method: ANY
          cors: true
      - http:
          path: /{proxy+}
          method: ANY
          cors: true

  # WebSocket - Connection
  websocketConnect:
    handler: src/websocket/connect.handler
    events:
      - websocket:
          route: $connect
          authorizer:
            name: websocketAuthorizer
            identitySource:
              - route.request.querystring.token

  # WebSocket Authorizer (registered so serverless knows the function exists)
  websocketAuthorizer:
    handler: src/websocket/authorizer.handler

  # WebSocket - Disconnection
  websocketDisconnect:
    handler: src/websocket/disconnect.handler
    events:
      - websocket:
          route: $disconnect

  # WebSocket - Default route for messages
  websocketDefault:
    handler: src/websocket/message.handler
    events:
      - websocket:
          route: $default

resources:
  Resources:
    # DynamoDB Tables
    BoardsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tablePrefix}-boards
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}
          - Key: Service
            Value: ${self:custom.serviceName}

    BoardMembersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-board-members
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: UserIndex
            KeySchema:
              - AttributeName: sk
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}
          - Key: Service
            Value: ${self:service}

    # CloudWatch Log Groups
    ApiLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /aws/lambda/${self:service}-${self:provider.stage}-api
        RetentionInDays: 30

    WebSocketLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /aws/lambda/${self:service}-${self:provider.stage}-websocket
        RetentionInDays: 30

plugins:
  - serverless-offline
  - serverless-dynamodb-local

package:
  exclude:
    - node_modules/**
    - .git/**
    - .env
    - test/**
    - docs/**
